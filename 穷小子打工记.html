<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>穷小子打工记</title>
<style>
  :root{
    --bg1:#1a1a2e; --bg2:#16213e; --accent:#ffb347; --accent2:#ff8c42;
    --green:#5cb85c; --red:#e05c5c; --gold:#ffd166; --text:#f5f5f5; --muted:#aab;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;color:var(--text);background:var(--bg1);-webkit-user-select:none;user-select:none;}

  /* ============ 登录界面 ============ */
  #authScreen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 20%, #2b3a67 0%, #16213e 45%, #0f0f1e 100%);overflow:auto;z-index:50;}
  .auth-card{width:min(440px,92vw);background:rgba(255,255,255,.06);backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:28px 26px;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .4s ease;}
  @keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
  .logo{text-align:center;margin-bottom:18px;}
  .logo h1{font-size:30px;font-weight:900;letter-spacing:2px;background:linear-gradient(90deg,#ffd166,#ff8c42,#ff5e62);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  .logo p{color:var(--muted);font-size:13px;margin-top:6px;}
  .tabs{display:flex;background:rgba(0,0,0,.25);border-radius:12px;padding:4px;margin-bottom:20px;}
  .tabs button{flex:1;padding:10px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:15px;font-weight:700;cursor:pointer;transition:.2s;}
  .tabs button.active{background:var(--accent);color:#1a1a2e;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;}
  .field input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.3);color:var(--text);font-size:15px;outline:none;transition:.2s;}
  .field input:focus{border-color:var(--accent);background:rgba(0,0,0,.45);}
  .field input::placeholder{color:#667;}
  .btn{width:100%;padding:13px;border:0;border-radius:11px;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#1a1a2e;font-size:16px;font-weight:800;cursor:pointer;transition:.15s;margin-top:4px;}
  .btn:hover{transform:translateY(-1px);filter:brightness(1.05);}
  .btn:active{transform:translateY(0);}
  .btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.2);color:var(--text);font-weight:600;font-size:14px;}
  .link{display:block;text-align:center;margin-top:14px;color:var(--accent);font-size:13px;cursor:pointer;}
  .link:hover{text-decoration:underline;}
  .msg{min-height:20px;font-size:13px;text-align:center;margin-top:12px;color:var(--red);}
  .msg.ok{color:var(--green);}
  .hint{font-size:12px;color:var(--muted);line-height:1.7;margin-top:16px;border-top:1px dashed rgba(255,255,255,.15);padding-top:12px;}
  .hidden{display:none !important;}

  /* ============ 游戏界面 ============ */
  #gameScreen{position:fixed;inset:0;background:#2e5d3a;z-index:10;}
  #gameCanvas{position:absolute;inset:0;display:block;}

  #hud{position:absolute;top:12px;left:12px;right:12px;display:flex;flex-wrap:wrap;gap:8px;z-index:20;pointer-events:none;}
  .hud-pill{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.15);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:700;backdrop-filter:blur(4px);}
  .hud-pill .ico{font-size:16px;}
  .hud-pill.gems{color:#7ee081;}
  .hud-pill.hunger{color:#ffb347;}
  .hud-pill.hp{color:#ff7e7e;}
  .bar{width:90px;height:8px;background:rgba(0,0,0,.5);border-radius:999px;overflow:hidden;}
  .bar>div{height:100%;transition:width .2s;}
  #hungerBar>div{background:linear-gradient(90deg,#ffb347,#ff8c42);}
  #hpBar>div{background:linear-gradient(90deg,#ff7e7e,#e05c5c);}

  #topRight{position:absolute;top:12px;right:12px;display:flex;gap:8px;z-index:21;flex-wrap:wrap;justify-content:flex-end;}
  .iconbtn{background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.15);color:var(--text);border-radius:10px;padding:8px 12px;font-size:13px;cursor:pointer;font-weight:700;transition:.15s;}
  .iconbtn:hover{background:rgba(0,0,0,.75);}

  #interactHint{position:absolute;bottom:140px;left:50%;transform:translateX(-50%);z-index:20;background:rgba(0,0,0,.75);border:1px solid var(--accent);color:#fff;padding:10px 18px;border-radius:12px;font-size:15px;font-weight:700;pointer-events:none;animation:pulse 1.2s ease-in-out infinite;text-align:center;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}

  #countdown{position:absolute;top:64px;left:50%;transform:translateX(-50%);z-index:22;background:rgba(200,20,20,.9);border:2px solid #fff;padding:8px 20px;border-radius:12px;font-size:18px;font-weight:900;pointer-events:none;animation:pulse .7s infinite;}

  #toasts{position:absolute;top:100px;left:50%;transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:92vw;}
  .toast{background:rgba(0,0,0,.85);border:1px solid rgba(255,255,255,.2);padding:9px 18px;border-radius:10px;font-size:14px;font-weight:700;animation:toastin .25s ease;text-align:center;}
  .toast.good{border-color:var(--green);color:#c6f0c6;}
  .toast.bad{border-color:var(--red);color:#ffc9c9;}
  .toast.info{border-color:var(--accent);color:#ffe0b3;}
  @keyframes toastin{from{transform:translateY(-12px);opacity:0}to{transform:translateY(0);opacity:1}}

  /* 通用弹窗 */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:center;justify-content:center;animation:fade .2s ease;}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal-card{background:#1e2138;border:1px solid rgba(255,255,255,.15);border-radius:18px;padding:22px;width:min(480px,94vw);max-height:86vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.6);animation:pop .2s ease;}
  .modal-card h3{margin-bottom:4px;font-size:19px;}
  .modal-card .sub{color:var(--muted);font-size:13px;margin-bottom:14px;}
  .row{display:flex;gap:10px;}
  .row .btn{flex:1;}
  .shop-item{display:flex;align-items:center;gap:12px;padding:11px;border-radius:12px;background:rgba(255,255,255,.04);margin-bottom:9px;}
  .shop-item .emo{font-size:26px;}
  .shop-item .info{flex:1;}
  .shop-item .info b{display:block;font-size:15px;}
  .shop-item .info span{font-size:12px;color:var(--muted);}
  .shop-item .buy{background:var(--accent);color:#1a1a2e;border:0;border-radius:9px;padding:9px 14px;font-weight:800;cursor:pointer;font-size:13px;white-space:nowrap;}
  .shop-item .buy:disabled{background:#555;color:#999;cursor:not-allowed;}
  .modal-card .close{width:100%;margin-top:8px;background:#333;color:#fff;}
  .modal-card .close:hover{background:#444;}
  .statgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
  .statgrid .cell{background:rgba(255,255,255,.05);border-radius:10px;padding:10px;text-align:center;}
  .statgrid .cell b{display:block;font-size:18px;color:var(--gold);}
  .statgrid .cell span{font-size:12px;color:var(--muted);}
  .helpbox{background:rgba(0,0,0,.3);border-radius:12px;padding:14px;font-size:13px;line-height:2;}
  .helpbox kbd{background:rgba(255,255,255,.12);border-radius:5px;padding:2px 8px;font-weight:700;color:var(--gold);}

  /* 背包 */
  .inv-item{display:flex;align-items:center;gap:10px;padding:9px;border-radius:10px;background:rgba(255,255,255,.04);margin-bottom:6px;font-size:14px;}
  .inv-item .emo{font-size:20px;}
  .inv-item .n{flex:1;}
  .inv-item .x{color:var(--muted);}
  .tag{font-size:11px;background:rgba(255,255,255,.1);padding:2px 7px;border-radius:6px;color:var(--muted);}

  /* 触屏 */
  #touchControls{position:absolute;inset:0;z-index:25;pointer-events:none;}
  #joystick{position:absolute;left:26px;bottom:26px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.2);pointer-events:auto;touch-action:none;}
  #joystick .knob{position:absolute;left:50%;top:50%;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.35);transform:translate(-50%,-50%);}
  #btnE{position:absolute;right:30px;bottom:40px;width:76px;height:76px;border-radius:50%;background:var(--accent);color:#1a1a2e;font-size:22px;font-weight:900;display:flex;align-items:center;justify-content:center;border:0;pointer-events:auto;box-shadow:0 6px 16px rgba(0,0,0,.4);}
  #btnE:active{transform:scale(.94);}
  #btnB{position:absolute;right:30px;bottom:130px;width:64px;height:64px;border-radius:50%;background:#7b6bc9;color:#fff;font-size:15px;font-weight:900;display:flex;align-items:center;justify-content:center;border:0;pointer-events:auto;box-shadow:0 6px 16px rgba(0,0,0,.4);}
  #btnB:active{transform:scale(.94);}

  /* 聊天框 */
  #chatBox{position:absolute;left:12px;bottom:12px;width:min(320px,60vw);z-index:22;}
  #chatLog{background:rgba(0,0,0,.5);border-radius:10px 10px 0 0;padding:8px 10px;max-height:120px;overflow-y:auto;font-size:13px;line-height:1.6;}
  #chatLog div{color:#eee;word-break:break-all;}
  #chatInput{width:100%;padding:9px 12px;border:1px solid rgba(255,255,255,.2);border-radius:0 0 10px 10px;background:rgba(0,0,0,.6);color:#fff;font-size:14px;outline:none;}
</style>
</head>
<body>

<!-- ============ 登录界面 ============ -->
<div id="authScreen">
  <button onclick="openSettings()" style="position:fixed;top:16px;right:16px;z-index:60;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:10px;padding:9px 14px;font-size:15px;cursor:pointer;">⚙️ 设置</button>
  <div class="auth-card">
    <div class="logo">
      <h1 id="gameTitle" onclick="titleTap()" style="cursor:pointer;">穷小子打工记</h1>
      <p>一款俯视角 2D 打工模拟游戏</p>
    </div>
    <div class="tabs">
      <button id="tabLogin" class="active" onclick="switchAuth('login')">登录</button>
      <button id="tabRegister" onclick="switchAuth('register')">注册账号</button>
    </div>
    <div id="loginForm">
      <div class="field"><label>用户名</label><input id="liUser" placeholder="请输入用户名" autocomplete="off"></div>
      <div class="field"><label>密码</label><input id="liPass" type="password" placeholder="请输入密码"></div>
      <button class="btn" onclick="doLogin()">登 录</button>
      <span class="link" onclick="switchAuth('forgot')">忘记密码？使用密保找回</span>
    </div>
    <div id="registerForm" class="hidden">
      <div class="field"><label>用户名（游戏中的显示名字）</label><input id="reUser" placeholder="输入您的用户名" autocomplete="off"></div>
      <div class="field"><label>密码</label><input id="rePass" type="password" placeholder="设置密码"></div>
      <div class="field"><label>确认密码</label><input id="rePass2" type="password" placeholder="再次输入密码"></div>
      <div class="field"><label>密保问题一：你的父亲是谁？</label><input id="reQ1" placeholder="三选一，任填一个即可" autocomplete="off"></div>
      <div class="field"><label>密保问题二：你最喜欢的玩具是什么？</label><input id="reQ2" placeholder="三选一，任填一个即可" autocomplete="off"></div>
      <div class="field"><label>密保问题三：你的班主任是谁？</label><input id="reQ3" placeholder="三选一，任填一个即可" autocomplete="off"></div>
      <button class="btn" onclick="doRegister()">注册并进入游戏</button>
      <div class="hint">⚠️ 密保用于密码丢失时找回。三个问题<b>任选一个</b>填写即可；找回时需输入用户名，并答对你当初填写的那一题。</div>
    </div>
    <div id="forgotForm" class="hidden">
      <div class="field"><label>请输入要找回的用户名</label><input id="fgUser" placeholder="请输入用户名" autocomplete="off"></div>
      <button class="btn" id="fgFindBtn" onclick="findAccount()">下一步</button>
      <div id="fgQuestions" class="hidden">
        <div id="fgQList"></div>
        <div class="field"><label>设置新密码</label><input id="fgNew" type="password" placeholder="请输入新密码"></div>
        <div class="field"><label>确认新密码</label><input id="fgNew2" type="password" placeholder="再次输入新密码"></div>
        <button class="btn" onclick="resetPassword()">重置密码</button>
      </div>
      <span class="link" onclick="switchAuth('login')">返回登录</span>
    </div>
    <div class="msg" id="authMsg"></div>
  </div>
</div>

<!-- ============ 游戏界面 ============ -->
<div id="gameScreen" class="hidden">
  <canvas id="gameCanvas"></canvas>

  <div id="hud">
    <div class="hud-pill gems"><span class="ico">💎</span><span id="hudGems">0</span></div>
    <div class="hud-pill hunger"><span class="ico">🍖</span>饱食度<div class="bar" id="hungerBar"><div></div></div><span id="hudHunger">100</span></div>
    <div class="hud-pill hp"><span class="ico">❤️</span>生命<div class="bar" id="hpBar"><div></div></div><span id="hudHp">100</span></div>
    <div class="hud-pill"><span class="ico">👤</span><span id="hudName">玩家</span></div>
    <div class="hud-pill" id="hudNet"><span class="ico">⚠️</span><span id="hudNetTxt">未连接</span></div>
  </div>

  <div id="topRight">
    <button class="iconbtn" id="adminBtn" onclick="openGameAdmin()" style="display:none;">🛠️</button>
    <button class="iconbtn" onclick="showPhone()">📱</button>
    <button class="iconbtn" onclick="showInventory()">🎒 背包</button>
    <button class="iconbtn" onclick="openFriends()">👥 好友</button>
    <button class="iconbtn" onclick="openSettings()">⚙️</button>
    <button class="iconbtn" onclick="showHelp()">❓</button>
    <button class="iconbtn" onclick="logout()">🚪 退出</button>
  </div>

  <div id="interactHint" class="hidden">按 E 互动</div>
  <div id="countdown" class="hidden"></div>
  <div id="toasts"></div>

  <div id="modalRoot" class="modal hidden">
    <div class="modal-card" id="modalCard"></div>
  </div>

  <div id="chatBox" class="hidden">
    <div id="chatLog"></div>
    <input id="chatInput" placeholder="按回车发送消息…" maxlength="200" autocomplete="off">
  </div>

  <div id="touchControls" class="hidden">
    <div id="joystick"><div class="knob"></div></div>
    <button id="btnE">E</button>
    <button id="btnB">乞讨</button>
  </div>
</div>

<!-- 管理员后台弹窗 -->
<div id="adminModal" class="modal hidden" style="z-index:70;">
  <div class="modal-card" id="adminCard"></div>
</div>

<!-- 设置弹窗 -->
<div id="settingsModal" class="modal hidden" style="z-index:70;">
  <div class="modal-card">
    <h3>⚙️ 设置</h3>
    <div class="sub">服务器与文件</div>
    <div class="field"><label>联机服务器地址</label><input id="setServer" placeholder="ws://localhost:3000" autocomplete="off"></div>
    <button class="btn" onclick="saveServer()">💾 保存服务器地址</button>
    <button class="btn ghost" onclick="downloadHtml()">⬇️ 下载 HTML 文件</button>
    <div class="helpbox" style="margin-top:10px">· 保存后重新登录即可用新地址联机<br>· 下载 HTML 会把当前游戏（含已设置的服务器地址）保存成一个文件，方便分享或部署</div>
    <button class="btn close" onclick="closeSettings()">关闭</button>
  </div>
</div>

<script>
/* ============================================================
   账号系统（登录 / 注册 / 密保找回）
============================================================ */
const USERS_KEY = 'pqdg_users_v2';
const SECURITY_QUESTIONS = [
  { key:'father', text:'你的父亲是谁？' },
  { key:'toy',    text:'你最喜欢的玩具是什么？' },
  { key:'teacher',text:'你的班主任是谁？' }
];
function hash(str){ let h=5381; for(let i=0;i<str.length;i++){ h=((h<<5)+h+str.charCodeAt(i))>>>0; } return h.toString(36); }
function loadUsers(){ try{ return JSON.parse(localStorage.getItem(USERS_KEY))||{}; }catch(e){ return {}; } }
function saveUsers(u){ localStorage.setItem(USERS_KEY, JSON.stringify(u)); }

let currentUser = null;

function switchAuth(mode){
  document.getElementById('tabLogin').classList.toggle('active', mode==='login');
  document.getElementById('tabRegister').classList.toggle('active', mode==='register');
  document.getElementById('loginForm').classList.toggle('hidden', mode!=='login');
  document.getElementById('registerForm').classList.toggle('hidden', mode!=='register');
  document.getElementById('forgotForm').classList.toggle('hidden', mode!=='forgot');
  document.getElementById('fgQuestions').classList.add('hidden');
  document.getElementById('fgFindBtn').classList.remove('hidden');
  setAuthMsg('');
}
function setAuthMsg(t, ok){ const m=document.getElementById('authMsg'); m.textContent=t; m.className='msg'+(ok?' ok':''); }

function doLogin(){
  const u=document.getElementById('liUser').value.trim(), p=document.getElementById('liPass').value;
  if(!u||!p){ setAuthMsg('请输入用户名和密码'); return; }
  const users=loadUsers(), rec=users[u];
  if(!rec){ setAuthMsg('该账号不存在，请先注册'); return; }
  if(rec.pass!==hash(p)){ setAuthMsg('密码错误'); return; }
  currentUser=u; connectAndEnter(rec.game);
}
function doRegister(){
  const u=document.getElementById('reUser').value.trim(), p=document.getElementById('rePass').value, p2=document.getElementById('rePass2').value;
  const a1=document.getElementById('reQ1').value.trim(), a2=document.getElementById('reQ2').value.trim(), a3=document.getElementById('reQ3').value.trim();
  if(!u){ setAuthMsg('请输入用户名'); return; }
  if(!/^[\u4e00-\u9fa5A-Za-z0-9_]{1,12}$/.test(u)){ setAuthMsg('用户名需为 1-12 位中文/字母/数字/下划线'); return; }
  if(p.length<4){ setAuthMsg('密码至少 4 位'); return; }
  if(p!==p2){ setAuthMsg('两次密码不一致'); return; }
  if(!a1&&!a2&&!a3){ setAuthMsg('请至少填写一个密保问题'); return; }
  const users=loadUsers();
  if(users[u]){ setAuthMsg('该用户名已被注册，请换一个'); return; }
  users[u]={ pass:hash(p), security:{father:a1,toy:a2,teacher:a3}, game:newGameData() };
  saveUsers(users); currentUser=u;
  setAuthMsg('注册成功，正在连接服务器…', true);
  connectAndEnter(users[u].game);
}
function findAccount(){
  const u=document.getElementById('fgUser').value.trim();
  if(!u){ setAuthMsg('请输入用户名'); return; }
  const users=loadUsers();
  if(!users[u]){ setAuthMsg('该账号不存在'); return; }
  const rec=users[u], sec=rec.security||{};
  const qs=[];
  if(sec.father) qs.push({key:'father',text:'你的父亲是谁？'});
  if(sec.toy) qs.push({key:'toy',text:'你最喜欢的玩具是什么？'});
  if(sec.teacher) qs.push({key:'teacher',text:'你的班主任是谁？'});
  if(!qs.length){ setAuthMsg('该账号未设置密保，无法找回'); return; }
  let html='';
  qs.forEach((q,i)=>{ html+=`<div class="field"><label>密保问题：${q.text}</label><input id="fgA${i}" data-key="${q.key}" placeholder="请输入答案" autocomplete="off"></div>`; });
  document.getElementById('fgQList').innerHTML=html;
  window._fgUser=u; window._fgQs=qs;
  document.getElementById('fgQuestions').classList.remove('hidden');
  document.getElementById('fgFindBtn').classList.add('hidden');
  setAuthMsg('已找到账号，请回答密保问题');
}
function resetPassword(){
  const u=window._fgUser, qs=window._fgQs||[];
  const np=document.getElementById('fgNew').value, np2=document.getElementById('fgNew2').value;
  const users=loadUsers(), rec=users[u];
  if(!rec){ setAuthMsg('账号不存在'); return; }
  for(let i=0;i<qs.length;i++){
    const ans=(document.getElementById('fgA'+i)||{}).value||'';
    if((rec.security[qs[i].key]||'').trim()!==ans.trim()){ setAuthMsg('密保答案不正确'); return; }
  }
  if(np.length<4){ setAuthMsg('新密码至少 4 位'); return; }
  if(np!==np2){ setAuthMsg('两次新密码不一致'); return; }
  rec.pass=hash(np); saveUsers(users);
  setAuthMsg('密码重置成功，请登录', true);
  setTimeout(()=>switchAuth('login'), 600);
}

/* ============================================================
   游戏数据定义
============================================================ */
const WORLD = { w: 2400, h: 4800 };

// 传送门

function enterGame(data){
  game = data || newGameData();
  if(game.hasIntro) game.zone='spawn';
  if(game.zone==='spawn'){ player.x=SPAWN_PLATFORM.x; player.y=SPAWN_PLATFORM.y+120; }
  else { player.x=game.x||CITY_SPAWN.x; player.y=game.y||CITY_SPAWN.y; }
  resetRunState();
  document.getElementById('authScreen').classList.add('hidden');
  document.getElementById('gameScreen').classList.remove('hidden');
  document.getElementById('hudName').textContent = currentUser||'玩家';
  const rec = loadUsers()[currentUser];
  document.getElementById('adminBtn').style.display = (rec && rec.admin) ? '' : 'none';
  resize();
  updateHUD();
  if(game.hasIntro){ game.hasIntro=false; toast('你出生在悬浮平台，进入穷人传送门开始打工生活吧！','info'); }
  else toast('欢迎回来，'+(currentUser||'玩家')+'！','info');
  if('ontouchstart' in window) document.getElementById('touchControls').classList.remove('hidden');
}
function resetRunState(){
  player.working=null; player.carryManholes=0; player.begging=false;
  delivery=null; taxi=null; documentJob=null; stallBiz=null;
  nearTarget=null; floatingTexts=[];
  document.getElementById('countdown').classList.add('hidden');
  document.getElementById('interactHint').classList.add('hidden');
}
function logout(){
  saveGame();
  resetRunState();
  closeModal();
  if(ws){ try{ ws.close(); }catch(e){} }
  wsConnected=false; remotePlayers={};
  document.getElementById('gameScreen').classList.add('hidden');
  document.getElementById('authScreen').classList.remove('hidden');
  currentUser=null; game=null; switchAuth('login');
}
function saveGame(){
  if(!currentUser||!game) return;
  game.x=player.x; game.y=player.y;
  const users=loadUsers();
  if(users[currentUser]){ users[currentUser].game=game; saveUsers(users); }
}
setInterval(saveGame, 4000);
window.addEventListener('beforeunload', saveGame);

function toast(txt, type){
  const box=document.getElementById('toasts');
  const el=document.createElement('div');
  el.className='toast '+(type||'info'); el.textContent=txt; box.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .4s'; setTimeout(()=>el.remove(),400); },2800);
}

function updateHUD(){
  if(!game) return;
  document.getElementById('hudGems').textContent = Math.floor(game.gems);
  document.getElementById('hudHunger').textContent = Math.floor(game.hunger);
  document.getElementById('hudHp').textContent = Math.floor(game.hp);
  document.getElementById('hungerBar').firstElementChild.style.width = (game.hunger)+'%';
  document.getElementById('hpBar').firstElementChild.style.width = (game.hp)+'%';
  const net=document.getElementById('hudNet');
  if(net){ net.querySelector('.ico').textContent = wsConnected ? '🔗' : '⚠️'; document.getElementById('hudNetTxt').textContent = wsConnected ? ('联机 '+Object.keys(remotePlayers).length+'人') : '未连接'; }

}

/* ============================================================
   交互检测
============================================================ */
function distToRect(px,py,r){ const cx=Math.max(r.x,Math.min(px,r.x+r.w)); const cy=Math.max(r.y,Math.min(py,r.y+r.h)); return Math.hypot(px-cx,py-cy); }
function findNear(){
  let best=null, bestD=60;
  if(game.zone==='spawn'){
    for(const p of PORTALS){ const d=Math.hypot(player.x-p.x, player.y-p.y)-p.r; if(d<bestD){bestD=d;best={type:'portal',ref:p};} }
  } else {
    for(const b of BUILDINGS){ if(b.hidden) continue; const d=distToRect(player.x,player.y,b); if(d<bestD){bestD=d;best={type:'building',ref:b};} }
    for(const s of STALLS){ const d=distToRect(player.x,player.y,s); if(d<bestD){bestD=d;best={type:'stall',ref:s};} }
    for(const m of MANHOLES){ const d=Math.hypot(player.x-m.x,player.y-m.y)-20; if(d<bestD){bestD=d;best={type:'manhole',ref:m};} }
    if(hasItem('stallframe')){
      for(const s of STALL_SPOTS){ const d=Math.hypot(player.x-s.x,player.y-s.y); if(d<bestD){bestD=d;best={type:'stallspot',ref:s};} }
    }
    for(const b of BUILDINGS){ if(!b.hidden) continue; const d=distToRect(player.x,player.y,b); if(d<bestD){bestD=d;best={type:'building',ref:b};} }
  }
  nearTarget=best;
  updateHint();
}
function updateHint(){
  const h=document.getElementById('interactHint');
  if(player.working || documentJob || player.begging){ h.classList.add('hidden'); return; }
  if(!nearTarget){ h.classList.add('hidden'); return; }
  const t=nearTarget;
  if(t.type==='portal') h.textContent = t.ref.usable ? '按 E 进入穷人传送门 → 城市' : '富豪传送门：永久封锁，无法进入';
  else if(t.type==='manhole') h.textContent = '按 E 偷井盖（有风险）';
  else if(t.type==='stallspot') h.textContent = '按 E 在这里摆摊开店';
  else if(t.type==='stall') h.textContent = '按 E 光顾 ' + t.ref.name;
  else {
    const b=t.ref;
    if(b.type==='delivery') h.textContent='按 E 进 ' + b.name + '（接/偷外卖）';
    else h.textContent='按 E 进入 ' + b.name;
  }
  h.classList.remove('hidden');
}

/* ============================================================

============================================================ */
function interact(){
  if(documentJob || player.working || player.begging){ stopWorking(); return; }
  if(!nearTarget){ return; }
  const t=nearTarget;
  if(t.type==='portal'){ if(t.ref.usable){ enterCity(); } else { toast('富豪传送门永久封锁，任何人都无法进入（纯装饰）','bad'); } }
  else if(t.type==='manhole') stealManhole();
  else if(t.type==='stallspot') startStall();
  else if(t.type==='stall') openStallShop(t.ref);
  else if(t.type==='building') handleBuilding(t.ref);
}
function enterCity(){
  game.zone='city';
  player.x=CITY_SPAWN.x; player.y=CITY_SPAWN.y;
  const items={phone:1,idcard:1,bowl:1,recipe:1,sign:1,stallframe:1};
  for(const k in items){ if(!game.inventory[k]) game.inventory[k]=1; }
  for(let i=0;i<10;i++) spawnNpc();
  toast('🎁 获得新手全套：棍母牌手机、身份证、乞讨碗、食谱、告示牌、摊位框架！','good');

}

function handleBuilding(b){
  switch(b.type){
    case 'vehicle': openVehicle(b); break;

    case 'food': openFood(b); break;
    case 'bank': openBank(); break;
    case 'contract': openContract(b); break;
    case 'delivery': openDelivery(b); break;
    case 'hardware': openHardware(); break;
    case 'gadget': openGadget(); break;
    case 'hospital': openHospital(); break;
    case 'taxi': openTaxi(); break;
    case 'market': openMarket(); break;
    case 'peace': openPeace(); break;
    case 'job996': openJob996(); break;
    case 'mine': openMine(); break;

    case 'villa': openVilla(); break;

function stealManhole(){
  if(Math.random()<0.15){
    toast('🕳️ 掀井盖时掉进下水道了！','bad');
    game.gems=Math.max(0,game.gems-20);

    player.x=CITY_SPAWN.x; player.y=CITY_SPAWN.y;
    nearTarget=null; updateHint();

  }
  game.inventory['manhole']=(game.inventory['manhole']||0)+1;
  player.carryManholes++;
  toast('🔩 偷到一个井盖！(减速，去五金店卖钱)','info');
  const idx=MANHOLES.indexOf(nearTarget.ref); if(idx>=0) MANHOLES.splice(idx,1);
  nearTarget=null; updateHint();
}
function openHardware(){
  let html=`<h3>🔧 五金店</h3><div class="sub">回收井盖、升级镐子</div>`;
  const mc=game.inventory['manhole']||0;
  if(mc>0){
    html+=`<div class="shop-item"><div class="emo">🔩</div><div class="info"><b>井盖 ×${mc}</b><span>每个回收 60💎</span></div>
      <button class="buy" onclick="sellManholes()">卖 ${mc} 个 (${mc*60}💎)</button></div>`;
  } else {
    html+=`<div class="helpbox">你没有井盖。去马路上找井盖偷（按E），小心掉下水道。</div>`;
  }
  html+=`<div class="sub" style="margin-top:12px">🪓 升级镐子（挖矿用）</div>`;
  const curIdx=PICKAXES.findIndex(x=>x.id===game.pickaxe);
  for(const p of PICKAXES){
    if(p.cost===0) continue;
    const idx=PICKAXES.findIndex(x=>x.id===p.id);
    const owned = curIdx >= idx;
    html+=`<div class="shop-item"><div class="emo">${p.emo}</div><div class="info"><b>${p.name}</b><span>挖矿效率 ×${p.power}</span></div>
      <button class="buy" ${(owned||game.gems<p.cost)?'disabled':''} onclick="buyPickaxe('${p.id}')">${owned?'已拥有':`💎${p.cost}`}</button></div>`;

function sellManholes(){

  updateHUD(); openHardware();
}

const joy=document.getElementById('joystick'), knob=joy.querySelector('.knob');
let joyVec={x:0,y:0}, joyActive=false;
joy.addEventListener('pointerdown', e=>{ joyActive=true; joy.setPointerCapture(e.pointerId); handleJoy(e); });
joy.addEventListener('pointermove', e=>{ if(joyActive) handleJoy(e); });
joy.addEventListener('pointerup', ()=>{ joyActive=false; joyVec={x:0,y:0}; knob.style.transform='translate(-50%,-50%)'; });
joy.addEventListener('pointercancel', ()=>{ joyActive=false; joyVec={x:0,y:0}; knob.style.transform='translate(-50%,-50%)'; });
function handleJoy(e){
  const r=joy.getBoundingClientRect();
  let dx=e.clientX-r.left-r.width/2, dy=e.clientY-r.top-r.height/2;
  const max=38, len=Math.hypot(dx,dy);
  if(len>max){ dx=dx/len*max; dy=dy/len*max; }
  knob.style.transform=`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  joyVec={x:dx/max,y:dy/max};
  if(Math.hypot(joyVec.x,joyVec.y)<0.2) joyVec={x:0,y:0};
}

/* ============================================================
   碰撞
============================================================ */
function getSolids(){
  const solids=[];
  if(game.zone==='spawn') return solids;
  for(const b of BUILDINGS){ solids.push(b); }
  for(const s of STALLS){ solids.push(s); }
  for(const t of TREES){ solids.push({x:t[0]-14,y:t[1]-14,w:28,h:28}); }
  return solids;
}
function resolveCollisions(){
  const solids=getSolids();
  for(const s of solids){
    const cx=Math.max(s.x,Math.min(player.x,s.x+s.w));
    const cy=Math.max(s.y,Math.min(player.y,s.y+s.h));
    let dx=player.x-cx, dy=player.y-cy;
    const d=Math.hypot(dx,dy);
    if(d<player.r){
      if(d===0){
        const l=player.x-s.x, r=s.x+s.w-player.x, t=player.y-s.y, b=s.y+s.h-player.y;
        const m=Math.min(l,r,t,b);
        if(m===l) player.x=s.x-player.r; else if(m===r) player.x=s.x+s.w+player.r;
        else if(m===t) player.y=s.y-player.r; else player.y=s.y+s.h+player.r;
      } else { player.x=cx+dx/d*player.r; player.y=cy+dy/d*player.r; }
    }
  }
  player.x=Math.max(player.r,Math.min(WORLD.w-player.r,player.x));
  player.y=Math.max(player.r,Math.min(WORLD.h-player.r,player.y));
}

/* ============================================================
   主循环
============================================================ */
function loop(now){
  const dt=Math.min(0.05,(now-lastTime)/1000); lastTime=now;
  if(game){ update(dt); render(); }
  requestAnimationFrame(loop);
}

function update(dt){
  // 移动
  let mx=0,my=0;
  if(keys['a']||keys['arrowleft']) mx-=1;
  if(keys['d']||keys['arrowright']) mx+=1;
  if(keys['w']||keys['arrowup']) my-=1;
  if(keys['s']||keys['arrowdown']) my+=1;
  if(joyVec.x||joyVec.y){ mx=joyVec.x; my=joyVec.y; }

  const busy = player.working || documentJob || player.begging;
  if(busy){ player.moving=false; }
  else {
    const len=Math.hypot(mx,my);
    if(len>0){
      mx/=len; my/=len;
      const sp = game.vehicle? VEHICLES[game.vehicle].speed : 240;
      const slow = player.carryManholes>0 ? 0.62 : 1;
      player.x+=mx*sp*slow*dt; player.y+=my*sp*slow*dt;
      player.moving=true; player.dirX=mx; player.dirY=my;
      if(Math.abs(mx)>Math.abs(my)) player.facing=mx>0?'right':'left';
      else player.facing=my>0?'down':'up';
    } else player.moving=false;
    resolveCollisions();
    findNear();
  }

  // NPC 模拟玩家
  if(game.zone==='city') updateNpcs(dt);

  // 联机：上报位置（限流 ~10 次/秒）
  if(wsConnected && ws){
    moveSendAcc += dt;
    if(moveSendAcc >= 0.1){
      moveSendAcc = 0;
      try{ ws.send(JSON.stringify({type:'move', x:player.x, y:player.y, facing:player.facing, moving:player.moving})); }catch(e){}
    }
  }

  // 饱食度下降
  hungerAcc+=dt;
  while(hungerAcc>=2.5){
    hungerAcc-=2.5;
    if(game.zone==='city'){
      game.hunger=Math.max(0,game.hunger-1);
      if(game.hunger<=0 && game.hp>0){ game.hp=Math.max(0,game.hp-5); }
    }
  }
  if(game.hp<=0){ die('饿死了'); return; }

  // 计时收益（电子厂 / 摆摊 / 承包）
  workTimer+=dt;
  while(workTimer>=1){
    workTimer-=1;
    let earned=0;
    if(player.working && player.working.kind==='factory'){ earned+=8; game.hunger=Math.max(0,game.hunger-1); }
    if(stallBiz) earned+=2;
    if(game.contract) earned+=1;
    if(earned>0){ game.gems+=earned; game.totalEarned+=earned; }
  }

  // 996 文档
  if(documentJob){
    if(documentJob.phase==='writing'){
      documentJob.progress+=dt;
      if(documentJob.progress>=8){ documentJob.phase='review'; documentJob.time=10; toast('📝 文档已提交，等待审核…','info'); }
    } else {
      documentJob.time-=dt;
      if(documentJob.time<=0){
        documentJob=null;
        game.gems+=80; game.totalEarned+=80;
        toast('✅ 审核通过！发工资 80💎','good');
        spawnFloating(player.x,player.y-26,'+80💎','#ffd166');
      }
    }
  }

  // 外卖
  if(delivery){
    const remain=(delivery.expires-performance.now())/1000;
    const cd=document.getElementById('countdown');
    cd.textContent='💣 外卖 ' + Math.max(0,Math.ceil(remain)) + 's';
    if(remain<=0){ deliveryExplode(); }
    else if(Math.hypot(player.x-delivery.x,player.y-delivery.y)<70){ deliverArrive(); }
  }
  // 网约车
  if(taxi){
    if(Math.hypot(player.x-taxi.x,player.y-taxi.y)<70){ taxiArrive(); }
  }

  // 浮动文字
  for(let i=floatingTexts.length-1;i>=0;i--){
    const f=floatingTexts[i]; f.y+=f.vy*dt; f.life-=dt*0.9;
    if(f.life<=0) floatingTexts.splice(i,1);
  }

  updateHUD();
}

/* ============================================================
   渲染
============================================================ */
function render(){
  cam.x=Math.max(0,Math.min(WORLD.w-W,player.x-W/2));
  cam.y=Math.max(0,Math.min(WORLD.h-H,player.y-H/2));
  if(game.zone==='spawn'){ renderSpawnPlatform(); }
  else { renderCity(); }
}

function drawGrass(){
  ctx.fillStyle='#3a7d44'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(0,0,0,.05)';
  for(let i=0;i<240;i++){
    const gx=(i*137.5)%WORLD.w, gy=(i*89.7)%WORLD.h;
    const sx=gx-cam.x, sy=gy-cam.y;
    if(sx>-20&&sy>-20&&sx<W+20&&sy<H+20) ctx.fillRect(sx,sy,3,3);
  }
}

function renderSpawnPlatform(){
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#2b3a67'); grad.addColorStop(1,'#16213e');
  ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,.15)';
  for(let i=0;i<12;i++){
    const cx=(i*337)%WORLD.w - cam.x, cy=(i*151)%600 - cam.y*0.2;
    ctx.beginPath(); ctx.arc(cx,cy,40,0,Math.PI*2); ctx.arc(cx+40,cy,30,0,Math.PI*2); ctx.fill();
  }
  const px=SPAWN_PLATFORM.x-cam.x, py=SPAWN_PLATFORM.y-cam.y;
  ctx.fillStyle='rgba(0,0,0,.35)';
  ctx.beginPath(); ctx.ellipse(px,py+180,330,70,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#4a8a50';
  ctx.beginPath(); ctx.ellipse(px,py,330,140,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#6fbf73'; ctx.lineWidth=6; ctx.stroke();
  ctx.fillStyle='rgba(0,0,0,.08)';
  for(let i=0;i<40;i++){ ctx.fillRect(px-320+(i*17)%640, py-130+(i*13)%260, 3,3); }
  ctx.fillStyle='#6b4226';
  ctx.beginPath(); ctx.ellipse(px,py+120,330,40,0,0,Math.PI*2); ctx.fill();

  for(const p of PORTALS){
    const x=p.x-cam.x, y=p.y-cam.y;
    ctx.fillStyle='rgba(0,0,0,.3)';
    ctx.beginPath(); ctx.ellipse(x,y+55,55,16,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#555'; ctx.fillRect(x-12,y-40,24,60);
    const pulse=0.8+Math.sin(performance.now()/300)*0.2;
    ctx.fillStyle=p.color; ctx.globalAlpha=pulse;
    ctx.beginPath(); ctx.ellipse(x,y,p.r,55,0,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
    ctx.strokeStyle='#fff'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.ellipse(x,y,p.r,55,0,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle='#fff'; ctx.font='bold 14px "Microsoft YaHei"'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(p.name, x, y-75);
    if(!p.usable){ ctx.fillStyle='#ff7e7e'; ctx.font='bold 12px "Microsoft YaHei"'; ctx.fillText('🔒 永久封锁', x, y+75); }
  }
  ctx.fillStyle='rgba(255,255,255,.9)'; ctx.font='bold 16px "Microsoft YaHei"'; ctx.textAlign='center';
  ctx.fillText('空中悬浮出生平台', px, py-100);
  ctx.fillStyle='#ffd166'; ctx.font='bold 14px "Microsoft YaHei"';
  ctx.fillText('👉 走进「穷人传送门」进入城市大世界', px, py-76);

  drawPlayer();
  drawFloating();
}

function renderCity(){
  drawGrass();
  drawRoads();
  for(const b of BUILDINGS){ if(!b.hidden) drawBuildingShape(b); }
  for(const s of STALLS){ drawBuildingShape(s); }
  for(const b of BUILDINGS){ if(b.hidden) drawBuildingShape(b); }
  drawManholes();
  drawTreesAndGuards();
  drawNpcs();
  drawRemotePlayers();
  drawMarkers();
  drawPlayer();
  drawFloating();
  drawBorders();
}

function drawRoads(){

function drawPlayer(){
  const x=player.x-cam.x, y=player.y-cam.y;
  ctx.fillStyle='rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(x,y+16,13,7,0,0,Math.PI*2); ctx.fill();
  if(game.vehicle && player.moving){
    ctx.fillStyle='rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(x,y+18,16,8,0,0,Math.PI*2); ctx.fill();
    ctx.font='28px sans-serif'; ctx.textAlign='center';
    ctx.fillText(VEHICLES[game.vehicle].emo, x, y);
  }
  ctx.fillStyle='#f0a04b'; ctx.beginPath(); ctx.arc(x,y,13,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#b06a2a'; ctx.lineWidth=2; ctx.stroke();
  if(player.facing==='down'){ ctx.fillRect(x-16,y-2,6,10); ctx.fillRect(x+10,y-2,6,10); }
  else if(player.facing==='up'){ ctx.fillRect(x-16,y-6,6,10); ctx.fillRect(x+10,y-6,6,10); }
  else if(player.facing==='left'){ ctx.fillRect(x-18,y-4,10,6); }
  else { ctx.fillRect(x+8,y-4,10,6); }
  ctx.fillStyle='#ffd9b3'; ctx.beginPath(); ctx.arc(x,y-8,9,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#3d2b1f'; ctx.beginPath(); ctx.arc(x,y-11,9,Math.PI,Math.PI*2); ctx.fill();
  ctx.fillStyle='#222';
  const fx=player.facing==='left'?-3:player.facing==='right'?3:0;
  const fy=player.facing==='up'?-2:player.facing==='down'?2:0;
  ctx.beginPath(); ctx.arc(x-3+fx*.4,y-7+fy*.4,1.6,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+3+fx*.4,y-7+fy*.4,1.6,0,Math.PI*2); ctx.fill();
  ctx.textAlign='center';
  if(delivery){ ctx.font='22px sans-serif'; ctx.fillText('💣', x, y-26); }
  else if(player.working){ ctx.font='22px sans-serif'; ctx.fillText('💪', x, y-26); }
  else if(stallBiz){ ctx.font='22px sans-serif'; ctx.fillText('🛒', x, y-26); }
  else if(player.begging){ ctx.font='22px sans-serif'; ctx.fillText('🥣', x, y-26); }
  else if(player.carryManholes>0){ ctx.font='20px sans-serif'; ctx.fillText('🔩×'+player.carryManholes, x, y-24); }
}

const AI_PLAYERS = ['打工人小王','老王','李四','张三','穷姐妹小花','外卖小哥阿强','搬砖小刘','网管阿伟','烧烤摊主老赵','快递员小陈','矿工老钱','程序员小周','夜市老板娘','出租车司机老孙','水电工老吴','保安大壮','厨师胖哥','流浪歌手阿凯','摊主阿芳','收银员小美'];
let npcs = [];
let npcSpawnAcc = 0;
function randomCityPoint(){ return { x:500+Math.random()*1800, y:900+Math.random()*2800 }; }
function spawnNpc(){
  if(npcs.length >= adminCfg.npcMax) return;
  const name = AI_PLAYERS[Math.floor(Math.random()*AI_PLAYERS.length)];
  const p = randomCityPoint();
  const colors = ['#e06c5a','#5aa9e0','#6fbf73','#e0a23c','#7b6bc9','#ff8c42','#5c8a8a','#d9a0ff'];
  const n = { name, x:p.x, y:p.y, tx:p.x, ty:p.y, speed:70+Math.random()*50, wait:0.5, color:colors[Math.floor(Math.random()*colors.length)] };
  pickNpcTarget(n); npcs.push(n);
}
function pickNpcTarget(n){ const p=randomCityPoint(); n.tx=p.x; n.ty=p.y; }
function npcInBuilding(n){
  for(const b of BUILDINGS){ if(n.x>b.x&&n.x<b.x+b.w&&n.y>b.y&&n.y<b.y+b.h) return true; }
  for(const s of STALLS){ if(n.x>s.x&&n.x<s.x+s.w&&n.y>s.y&&n.y<s.y+s.h) return true; }
  return false;
}
function updateNpcs(dt){
  for(const n of npcs){
    if(n.wait>0){ n.wait-=dt; continue; }
    const dx=n.tx-n.x, dy=n.ty-n.y, d=Math.hypot(dx,dy);
    if(d<10){ n.wait=0.5+Math.random()*2.5; pickNpcTarget(n); continue; }
    n.x += dx/d*n.speed*dt; n.y += dy/d*n.speed*dt;
    if(npcInBuilding(n)) pickNpcTarget(n);
  }
  npcSpawnAcc += dt;
  if(adminCfg.npcEnabled && npcSpawnAcc >= adminCfg.npcInterval){ npcSpawnAcc=0; spawnNpc(); }
}
function drawNpcs(){
  for(const n of npcs){
    const x=n.x-cam.x, y=n.y-cam.y;
    if(x<-40||y<-40||x>W+40||y>H+40) continue;
    ctx.fillStyle='rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(x,y+14,11,6,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=n.color; ctx.beginPath(); ctx.arc(x,y,10,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#ffd9b3'; ctx.beginPath(); ctx.arc(x,y-6,7,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#3d2b1f'; ctx.beginPath(); ctx.arc(x,y-8,7,Math.PI,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='bold 10px "Microsoft YaHei"'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.strokeStyle='rgba(0,0,0,.5)'; ctx.lineWidth=3; ctx.strokeText(n.name, x, y-20);
    ctx.fillText(n.name, x, y-20);
  }
}

/* ============================================================
   实时联机（WebSocket 客户端）
============================================================ */
let SERVER_URL = (new URLSearchParams(location.search).get('server')) || (localStorage.getItem('pqdg_server') || 'ws://localhost:3000');
const MY_ID = Math.random().toString(36).slice(2) + Date.now().toString(36);
let ws = null, wsConnected = false, remotePlayers = {};
let moveSendAcc = 0;
let pendingEnter = null;

function connectServer(){
  if(!('WebSocket' in window)) return;
  try { ws = new WebSocket(SERVER_URL); } catch(e){ ws=null; return; }
  ws.onopen = ()=>{
    wsConnected = true;
    if(pendingEnter){ const d=pendingEnter; pendingEnter=null; enterGame(d); }
    else { toast('🔗 已重新连接','good'); }
    sendJoin(); updateHUD();
  };
  ws.onmessage = (e)=> handleServerMsg(e.data);
  ws.onclose = ()=>{
    const was = wsConnected; wsConnected=false; remotePlayers={}; updateHUD();
    if(pendingEnter){ pendingEnter=null; setAuthMsg('连接服务器失败，请在「设置」里检查地址'); }
    else if(was && game && !document.getElementById('gameScreen').classList.contains('hidden')) showDisconnect();
  };
  ws.onerror = ()=>{};
}
function connectAndEnter(data){
  if(!('WebSocket' in window)){ setAuthMsg('浏览器不支持 WebSocket，无法联机'); return; }
  setAuthMsg('正在连接服务器…');
  pendingEnter = data;
  connectServer();
  setTimeout(()=>{
    if(pendingEnter){ pendingEnter=null; if(ws){ try{ws.close();}catch(e){} } ws=null; wsConnected=false; setAuthMsg('连接服务器超时，请在「设置」里检查地址'); }
  }, 10000);
}
function showDisconnect(){
  showModal(`<h3>⚠️ 连接已断开</h3><div class="sub">与服务器的连接已断开，无法继续游戏。</div>
    <button class="btn" onclick="reconnect()">重新连接</button>
    <button class="btn ghost" onclick="logout()">返回登录</button>`);
}
function reconnect(){ closeModal(); connectServer(); }
function sendJoin(){
  if(!wsConnected || !ws) return;
  ws.send(JSON.stringify({ type:'join', id:MY_ID, name:currentUser||'玩家', x:player.x, y:player.y, facing:player.facing }));
}
function handleServerMsg(data){
  let m; try{ m=JSON.parse(data); }catch(e){ return; }
  if(m.type==='init'){
    remotePlayers={};
    (m.players||[]).forEach(p=>{ if(p.id!==MY_ID) remotePlayers[p.id]={id:p.id,name:p.name,x:p.x,y:p.y,facing:p.facing,moving:p.moving}; });
  }
  else if(m.type==='join'){ if(m.id!==MY_ID) remotePlayers[m.id]={id:m.id,name:m.name,x:m.x,y:m.y,facing:m.facing,moving:m.moving}; }
  else if(m.type==='move'){ const r=remotePlayers[m.id]; if(r){ r.x=m.x; r.y=m.y; r.facing=m.facing; r.moving=m.moving; } }
  else if(m.type==='leave'){ delete remotePlayers[m.id]; }
  else if(m.type==='chat'){ showChat(m.name, m.text); }
}
function drawRemotePlayers(){
  for(const id in remotePlayers){
    const p=remotePlayers[id];
    const x=p.x-cam.x, y=p.y-cam.y;
    if(x<-40||y<-40||x>W+40||y>H+40) continue;
    ctx.fillStyle='rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(x,y+14,11,6,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#4aa3ff'; ctx.beginPath(); ctx.arc(x,y,10,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#ffd9b3'; ctx.beginPath(); ctx.arc(x,y-6,7,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#3d2b1f'; ctx.beginPath(); ctx.arc(x,y-8,7,Math.PI,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='bold 10px "Microsoft YaHei"'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.strokeStyle='rgba(0,0,0,.5)'; ctx.lineWidth=3; ctx.strokeText(p.name, x, y-20);
    ctx.fillText(p.name, x, y-20);
  }
}
function sendChat(){
  const inp=document.getElementById('chatInput');
  const text=inp.value.trim();
  if(!text) return;
  inp.value='';
  if(wsConnected && ws){ try{ ws.send(JSON.stringify({type:'chat', text})); }catch(e){} showChat(currentUser||'玩家', text); }
  else { toast('未连接服务器，无法聊天','bad'); }
}
function showChat(name, text){
  addChatLine(name, text);
  const rp = Object.values(remotePlayers).find(p=>p.name===name);
  const x = rp ? rp.x : player.x;
  const y = rp ? rp.y : player.y;
  floatingTexts.push({ x, y: y-42, txt:'💬 '+name+': '+text, color:'#fff', life:2.5, vy:-22 });
}
function addChatLine(name, text){
  const log=document.getElementById('chatLog');
  const div=document.createElement('div');
  div.textContent = name + '：' + text;
  log.appendChild(div);
  while(log.children.length > 20) log.removeChild(log.firstChild);
  log.scrollTop = log.scrollHeight;
}

/* —— 设置（服务器地址 + 下载 HTML） —— */
function openSettings(){
  document.getElementById('setServer').value = SERVER_URL;
  document.getElementById('settingsModal').classList.remove('hidden');
}
function closeSettings(){ document.getElementById('settingsModal').classList.add('hidden'); }
function saveServer(){
  const v = document.getElementById('setServer').value.trim();
  if(!v){ alert('服务器地址不能为空'); return; }
  localStorage.setItem('pqdg_server', v);
  SERVER_URL = v;
  alert('服务器地址已保存，重新登录后生效');
  closeSettings();
}
function downloadHtml(){
  let html;
  try { html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML; }
  catch(e){ alert('下载失败'); return; }
  html = html.replace("'ws://localhost:3000'", "'" + String(SERVER_URL).replace(/'/g, "\\'") + "'");
  const blob = new Blob([html], { type:'text/html;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '穷小子打工记.html';
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{ a.remove(); URL.revokeObjectURL(a.href); }, 200);
}
document.getElementById('settingsModal').addEventListener('click', e=>{ if(e.target.id==='settingsModal') closeSettings(); });

/* ============================================================
   启动
============================================================ */
resize();
requestAnimationFrame(loop);
</script>
